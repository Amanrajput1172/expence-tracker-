<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Expense Tracker - Working Model</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', 'Outfit', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #667eea 100%);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  min-height: 100vh;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
  pointer-events: none;
  z-index: -1;
}

.container {
  max-width: 1000px;
  margin: auto;
  background: linear-gradient(135deg, rgba(20, 20, 50, 0.95), rgba(40, 30, 80, 0.95));
  backdrop-filter: blur(10px);
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  animation: slideUp 0.8s ease-out;
  border: 1px solid rgba(102, 126, 234, 0.3);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  flex-wrap: wrap;
  gap: 20px;
}

h1 {
  font-family: 'Playfair Display', serif;
  color: #fff;
  font-size: 2.5em;
  background: linear-gradient(135deg, #4facfe, #f093fb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeInDown 0.8s ease-out, textGlow 3s ease-in-out infinite;
  letter-spacing: 1px;
  font-weight: 700;
  text-shadow: 0 0 30px rgba(79, 172, 254, 0.3);
  margin: 0;
}

@keyframes textGlow {
  0%, 100% {
    text-shadow: 0 0 10px rgba(79, 172, 254, 0.3), 0 0 20px rgba(240, 147, 251, 0.2);
  }
  50% {
    text-shadow: 0 0 20px rgba(79, 172, 254, 0.6), 0 0 30px rgba(240, 147, 251, 0.4);
  }
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.stats-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  animation: fadeInUp 0.8s ease-out 0.15s both;
}

.stat-card {
  background: rgba(255, 255, 255, 0.1);
  padding: 15px;
  border-radius: 15px;
  border: 1px solid rgba(102, 126, 234, 0.3);
  text-align: center;
  transition: all 0.3s ease;
}

.stat-card:hover {
  background: rgba(79, 172, 254, 0.15);
  border-color: #4facfe;
  transform: translateY(-5px);
}

.stat-label {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  background: linear-gradient(135deg, #4facfe, #f093fb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: numberPulse 2s ease-in-out infinite;
}

@keyframes numberPulse {
  0%, 100% {
    text-shadow: 0 0 0 rgba(240, 147, 251, 0);
  }
  50% {
    text-shadow: 0 0 10px rgba(240, 147, 251, 0.6);
  }
}

form {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 30px;
  animation: fadeInUp 0.8s ease-out 0.2s both;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

input, select {
  padding: 12px 15px;
  border: 2px solid rgba(102, 126, 234, 0.5);
  border-radius: 10px;
  font-size: 1em;
  transition: all 0.3s ease;
  flex: 1;
  min-width: 120px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-weight: 500;
  letter-spacing: 0.3px;
}

input:focus, select:focus {
  outline: none;
  border-color: #4facfe;
  box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.15);
  animation: inputPulse 0.6s ease;
}

@keyframes inputPulse {
  0% { box-shadow: 0 0 0 0 rgba(79, 172, 254, 0.5); }
  50% { box-shadow: 0 0 0 5px rgba(79, 172, 254, 0.3); }
  100% { box-shadow: 0 0 0 0 rgba(79, 172, 254, 0); }
}

input::placeholder {
  color: rgba(255, 255, 255, 0.6);
}

input[type="date"] {
  min-width: 150px;
}

button {
  padding: 12px 30px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1em;
  font-weight: 600;
  font-family: 'Poppins', sans-serif;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
  position: relative;
  overflow: hidden;
}

button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.2);
  transition: left 0.5s ease;
  z-index: 0;
}

button:hover::before {
  left: 100%;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
  letter-spacing: 1px;
}

button:active {
  transform: translateY(-1px);
}

.secondary-btn {
  background: linear-gradient(135deg, rgba(102, 126, 234, 0.5), rgba(118, 75, 162, 0.5));
  font-size: 0.9em;
  padding: 10px 20px;
}

.delete-btn {
  background: linear-gradient(135deg, #f093fb, #f5576c);
  padding: 8px 15px;
  font-size: 0.85em;
}

.delete-btn:hover {
  box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
}

.edit-btn {
  background: linear-gradient(135deg, #4facfe, #00d4ff);
  padding: 8px 15px;
  font-size: 0.85em;
  margin-right: 5px;
}

.edit-btn:hover {
  box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
}

.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  animation: fadeInUp 0.8s ease-out 0.3s both;
}

.filter-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-label {
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.9em;
  font-weight: 500;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  animation: fadeInUp 0.8s ease-out 0.4s both;
}

thead {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
}

th {
  padding: 15px;
  text-align: center;
  font-weight: 600;
  letter-spacing: 0.5px;
  font-family: 'Poppins', sans-serif;
  text-transform: uppercase;
  font-size: 0.9em;
}

td {
  padding: 15px;
  text-align: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  transition: all 0.3s ease;
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-weight: 500;
}

tbody tr {
  animation: rowSlideIn 0.4s ease-out backwards;
}

tbody tr:nth-child(1) { animation-delay: 0.5s; }
tbody tr:nth-child(2) { animation-delay: 0.55s; }
tbody tr:nth-child(3) { animation-delay: 0.6s; }
tbody tr:nth-child(4) { animation-delay: 0.65s; }
tbody tr:nth-child(5) { animation-delay: 0.7s; }

@keyframes rowSlideIn {
  from {
    opacity: 0;
    transform: translateX(-20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

tbody tr:hover {
  background: rgba(102, 126, 234, 0.2);
  transform: scale(1.01);
}

tbody tr:hover td {
  color: #4facfe;
}

.amount {
  font-weight: 700;
  color: #f093fb;
  font-size: 1.1em;
  letter-spacing: 0.5px;
  animation: numberPulse 2s ease-in-out infinite;
}

.category-badge {
  display: inline-block;
  padding: 6px 12px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border-radius: 20px;
  font-size: 0.85em;
  font-weight: 600;
  letter-spacing: 0.3px;
  transition: all 0.3s ease;
  box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
}

tbody tr:hover .category-badge {
  box-shadow: 0 4px 15px rgba(79, 172, 254, 0.5);
  transform: scale(1.05);
}

.date-cell {
  font-size: 0.9em;
  color: rgba(255, 255, 255, 0.8);
}

.charts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 30px;
  margin-top: 40px;
  animation: fadeInUp 0.8s ease-out 0.6s both;
}

.chart-container {
  position: relative;
  height: 300px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 15px;
  padding: 20px;
  border: 1px solid rgba(102, 126, 234, 0.2);
}

.chart-title {
  color: #fff;
  font-size: 1.1em;
  font-weight: 600;
  margin-bottom: 15px;
  text-align: center;
}

canvas {
  max-width: 100%;
  max-height: 260px;
  display: block;
  margin: 0 auto;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: rgba(255, 255, 255, 0.7);
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 15px;
}

.notification {
  position: fixed;
  top: 20px;
  right: 20px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 15px 25px;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
  animation: slideInRight 0.4s ease-out;
  z-index: 1000;
  max-width: 300px;
}

@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(400px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  animation: fadeInUp 0.8s ease-out 0.35s both;
}

.success {
  background: linear-gradient(135deg, #4facfe, #00d4ff);
}

.error {
  background: linear-gradient(135deg, #f093fb, #f5576c);
}

@media (max-width: 768px) {
  .container {
    padding: 20px;
  }
  
  h1 {
    font-size: 1.8em;
  }
  
  .header {
    flex-direction: column;
    align-items: flex-start;
  }
  
  form {
    flex-direction: column;
  }
  
  input, select, button {
    width: 100%;
  }
  
  .charts-grid {
    grid-template-columns: 1fr;
  }
  
  table {
    font-size: 0.85em;
  }
  
  th, td {
    padding: 10px;
  }
  
  .controls {
    flex-direction: column;
  }
  
  .controls button {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>💰 Premium Expense Tracker</h1>
  </div>

  <div class="stats-container">
    <div class="stat-card">
      <div class="stat-label">Total Expenses</div>
      <div class="stat-value" id="totalStat">₹0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">This Month</div>
      <div class="stat-value" id="monthStat">₹0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Expenses Count</div>
      <div class="stat-value" id="countStat">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Average Expense</div>
      <div class="stat-value" id="avgStat">₹0</div>
    </div>
  </div>

  <form id="expenseForm">
    <input id="title" placeholder="Expense title..." required>
    <input id="amount" type="number" placeholder="Amount" step="0.01" required>
    <input id="date" type="date" required>
    <select id="category">
      <option>Food</option>
      <option>Travel</option>
      <option>Shopping</option>
      <option>Bills</option>
      <option>Entertainment</option>
      <option>Health</option>
      <option>Education</option>
      <option>Other</option>
    </select>
    <button type="submit">Add Expense</button>
  </form>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Filter by:</span>
      <select id="categoryFilter" style="flex: 0 1 auto;">
        <option value="">All Categories</option>
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Health</option>
        <option>Education</option>
        <option>Other</option>
      </select>
      <input id="searchFilter" type="text" placeholder="Search expenses..." style="flex: 0 1 auto; min-width: 150px;">
    </div>
  </div>

  <div class="controls">
    <button class="secondary-btn" onclick="exportData()">📥 Export to CSV</button>
    <button class="secondary-btn" onclick="clearAllData()">🗑️ Clear All</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Title</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="expenseList"></tbody>
  </table>

  <div class="charts-grid">
    <div class="chart-container">
      <div class="chart-title">Spending by Category</div>
      <canvas id="categoryChart"></canvas>
    </div>
    <div class="chart-container">
      <div class="chart-title">Monthly Trend</div>
      <canvas id="monthlyChart"></canvas>
    </div>
  </div>
</div>

<script>
let expenses = [];
let categoryChart;
let monthlyChart;

function loadExpenses() {
  const saved = localStorage.getItem('expenses');
  expenses = saved ? JSON.parse(saved) : [];
  render();
}

function saveExpenses() {
  localStorage.setItem('expenses', JSON.stringify(expenses));
}

function showNotification(message, type = 'success') {
  const notif = document.createElement('div');
  notif.className = `notification ${type}`;
  notif.textContent = message;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 3000);
}

document.getElementById("expenseForm").addEventListener("submit", e => {
  e.preventDefault();
  
  const title = document.getElementById("title").value.trim();
  const amount = parseFloat(document.getElementById("amount").value);
  const date = document.getElementById("date").value;
  const category = document.getElementById("category").value;
  
  if (!title || !amount || !date) {
    showNotification('Please fill all fields', 'error');
    return;
  }
  
  if (amount <= 0) {
    showNotification('Amount must be greater than 0', 'error');
    return;
  }
  
  const newExpense = {
    id: Date.now(),
    title: title,
    amount: amount,
    date: date,
    category: category
  };
  
  expenses.push(newExpense);
  saveExpenses();
  e.target.reset();
  document.getElementById("title").focus();
  
  const today = new Date().toISOString().split('T')[0];
  document.getElementById("date").value = today;
  
  render();
  showNotification('Expense added successfully!', 'success');
});

function del(id) {
  if (confirm('Are you sure you want to delete this expense?')) {
    expenses = expenses.filter(e => e.id !== id);
    saveExpenses();
    render();
    showNotification('Expense deleted', 'success');
  }
}

function editExpense(id) {
  const expense = expenses.find(e => e.id === id);
  if (expense) {
    document.getElementById("title").value = expense.title;
    document.getElementById("amount").value = expense.amount;
    document.getElementById("date").value = expense.date;
    document.getElementById("category").value = expense.category;
    del(id);
    document.getElementById("title").focus();
  }
}

function updateStats() {
  const total = expenses.reduce((sum, e) => sum + e.amount, 0);
  const count = expenses.length;
  const average = count > 0 ? total / count : 0;
  
  const today = new Date();
  const currentMonth = today.getMonth();
  const currentYear = today.getFullYear();
  
  const monthTotal = expenses.reduce((sum, e) => {
    const expDate = new Date(e.date);
    if (expDate.getMonth() === currentMonth && expDate.getFullYear() === currentYear) {
      return sum + e.amount;
    }
    return sum;
  }, 0);
  
  document.getElementById("totalStat").textContent = '₹' + total.toFixed(2);
  document.getElementById("monthStat").textContent = '₹' + monthTotal.toFixed(2);
  document.getElementById("countStat").textContent = count;
  document.getElementById("avgStat").textContent = '₹' + average.toFixed(2);
}

function getFilteredExpenses() {
  const categoryFilter = document.getElementById("categoryFilter").value;
  const searchFilter = document.getElementById("searchFilter").value.toLowerCase();
  
  return expenses.filter(e => {
    const categoryMatch = !categoryFilter || e.category === categoryFilter;
    const searchMatch = !searchFilter || 
                       e.title.toLowerCase().includes(searchFilter) ||
                       e.amount.toString().includes(searchFilter);
    return categoryMatch && searchMatch;
  }).sort((a, b) => new Date(b.date) - new Date(a.date));
}

function render() {
  updateStats();
  renderTable();
  renderCharts();
}

function renderTable() {
  const list = document.getElementById("expenseList");
  const filtered = getFilteredExpenses();
  
  if (filtered.length === 0) {
    list.innerHTML = '<tr><td colspan="5" style="padding: 40px;">No expenses found. Add one to get started! 📝</td></tr>';
    return;
  }
  
  list.innerHTML = "";
  
  filtered.forEach((e, index) => {
    const row = document.createElement("tr");
    const dateObj = new Date(e.date);
    const formattedDate = dateObj.toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
    
    row.innerHTML = `
      <td class="date-cell">${formattedDate}</td>
      <td>${e.title}</td>
      <td class="amount">₹${e.amount.toFixed(2)}</td>
      <td><span class="category-badge">${e.category}</span></td>
      <td>
        <button class="edit-btn" onclick="editExpense(${e.id})">Edit</button>
        <button class="delete-btn" onclick="del(${e.id})">Delete</button>
      </td>
    `;
    list.appendChild(row);
  });
}

function renderCharts() {
  renderCategoryChart();
  renderMonthlyChart();
}

function renderCategoryChart() {
  const totals = {};
  expenses.forEach(e => {
    totals[e.category] = (totals[e.category] || 0) + e.amount;
  });
  
  if (categoryChart) categoryChart.destroy();
  
  const ctx = document.getElementById("categoryChart");
  const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#fa709a', '#fee140', '#00d4ff', '#ff6b9d'];
  
  if (Object.keys(totals).length === 0) {
    ctx.style.display = 'none';
    ctx.parentElement.innerHTML += '<div class="empty-state">No data yet</div>';
    return;
  }
  
  categoryChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: Object.keys(totals),
      datasets: [{
        data: Object.values(totals),
        backgroundColor: colors.slice(0, Object.keys(totals).length),
        borderColor: '#fff',
        borderWidth: 3,
        borderRadius: 10,
        offset: 10
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            padding: 15,
            font: { size: 12, weight: 600 },
            color: '#fff',
            usePointStyle: true,
            pointStyle: 'circle'
          }
        }
      },
      animation: {
        animateRotate: true,
        duration: 1000,
        easing: 'easeInOutQuart'
      }
    }
  });
}

function renderMonthlyChart() {
  const monthlyData = {};
  
  expenses.forEach(e => {
    const date = new Date(e.date);
    const monthKey = date.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
    monthlyData[monthKey] = (monthlyData[monthKey] || 0) + e.amount;
  });
  
  if (monthlyChart) monthlyChart.destroy();
  
  const ctx = document.getElementById("monthlyChart");
  const sortedMonths = Object.keys(monthlyData).sort();
  
  if (sortedMonths.length === 0) {
    ctx.style.display = 'none';
    ctx.parentElement.innerHTML += '<div class="empty-state">No data yet</div>';
    return;
  }
  
  monthlyChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: sortedMonths,
      datasets: [{
        label: 'Monthly Spending',
        data: sortedMonths.map(m => monthlyData[m]),
        backgroundColor: 'rgba(102, 126, 234, 0.7)',
        borderColor: '#667eea',
        borderWidth: 2,
        borderRadius: 8,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'x',
      plugins: {
        legend: {
          labels: { color: '#fff', font: { weight: 600 } }
        }
      },
      scales: {
        y: {
          ticks: { color: rgba(255, 255, 255, 0.8) },
          grid: { color: 'rgba(255, 255, 255, 0.1)' }
        },
        x: {
          ticks: { color: 'rgba(255, 255, 255, 0.8)' },
          grid: { color: 'rgba(255, 255, 255, 0.1)' }
        }
      }
    }
  });
}

function exportData() {
  if (expenses.length === 0) {
    showNotification('No expenses to export', 'error');
    return;
  }
  
  let csv = 'Date,Title,Amount,Category\n';
  expenses.forEach(e => {
    csv += `"${e.date}","${e.title}",${e.amount},"${e.category}"\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `expenses-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  
  showNotification('Data exported successfully!', 'success');
}

function clearAllData() {
  if (confirm('⚠️ Are you sure? This will delete ALL expenses permanently!')) {
    if (confirm('Are you REALLY sure? This cannot be undone!')) {
      expenses = [];
      saveExpenses();
      render();
      showNotification('All data cleared', 'success');
    }
  }
}

document.getElementById("categoryFilter").addEventListener("change", () => renderTable());
document.getElementById("searchFilter").addEventListener("input", () => renderTable());

const today = new Date().toISOString().split('T')[0];
document.getElementById("date").value = today;

loadExpenses();
</script>
</body>
</html>
